namespace: garuda
name: wg-pt
config:
  kernel_ifname: wg-pt
  private_key: stubprivatekey
  address: 192.0.2.2/30
  listen_port: null
peer:
  public_key: stubpublickey
  endpoint_host: hub.example.net
  listen_port: 55820
  preshared_key: ""
allowed_nets:
  - 0.0.0.0/0
table: "off"
persistent_keepalive: 25
images:
  wireguard: ghcr.io/garuda-tunnel/garuda-wireguard:latest
# Non-default MTU policy (schema bands: effectiveMtu 1280..1420, fixedMss
# 536..1460) so the golden pins what values actually pass, not a chart default.
mtuPolicy:
  effectiveMtu: 1280
  fixedMss: 1240
  mssClampEnabled: false
